<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick and Morty Web</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-gray-900 text-white flex flex-col items-center p-6">

  <h1 class="text-4xl font-bold text-green-400 mb-6">
    Rick and Morty
  </h1>

  <div class="bg-gray-800 rounded-xl shadow-lg p-6 w-full max-w-md text-center">

    <img id="imagem" src=""  class="w-52 h-52 rounded-full mx-auto border-4 border-green-400">
    <h2 id="nome" class="text-2xl font-bold mt-4">
      Carregando
    </h2>

    <p class="mt-2">
      <strong>Espécie:</strong>
      <span id="especie"></span>
    </p>

    <p> <strong>Status:</strong>
      <span id="status"></span> </p>

    
    
    <p>
      <strong>Gênero:</strong>
      <span id="genero"></span>
    </p>

    <p>
      <strong>  Origem: </strong>
      <span id="origem"></span>
    </p>

    <button id="botao" class="mt-6 bg-green-500 hover:bg-green-600 px-5 py-2 rounded-lg font-bold">
      Sortear Personagem
    </button>

  </div>

  <script src="script.js"></script>
  <footer>
    <p>IFPE-CAMPUS PALMARES</p>
    <p>feito por CAIO PEDROSA</p>
  </footer>
</body>

</html>
